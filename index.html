<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F8FB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AVEN">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AVEN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
/* Layout: 전체 화면 지도 위에 검색창·패널·탭을 띄운다. 넓은 화면은 왼쪽 패널, 좁은 화면은 하단 시트. */
:root{
  --bg:#E9EDF2; --panel:#F6F8FB; --card:#FFFFFF; --line:#D5DCE5; --fg:#111A26; --muted:#566475; --faint:#8490A0;
  --accent:#1F4FD8; --accent-fg:#FFFFFF; --accent-soft:#E3EAFC;
  --warn:#A65F00; --warn-soft:#FCEFD8; --crit:#C22B38; --crit-soft:#FBE4E6; --ok:#0A7A50; --ok-soft:#DDF3E9;
  --road:#BCC6D3; --land:#DFE5EC; --water:#C6DAF0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.10); --scrim:rgba(10,16,26,.55);
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --display:'Space Grotesk','IBM Plex Sans KR','Malgun Gothic',sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Consolas,'Malgun Gothic',monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#090D13; --panel:#10161F; --card:#18202D; --line:#2A3445; --fg:#E8EDF4; --muted:#9BA8B9; --faint:#6F7C8E;
  --accent:#86A8FF; --accent-fg:#0A1020; --accent-soft:#1B2A4D;
  --warn:#FFB454; --warn-soft:#3A2A10; --crit:#FF7F8A; --crit-soft:#3D1A1F; --ok:#4FD6A0; --ok-soft:#113327;
  --road:#3B475A; --land:#151D29; --water:#14263D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#090D13; --panel:#10161F; --card:#18202D; --line:#2A3445; --fg:#E8EDF4; --muted:#9BA8B9; --faint:#6F7C8E;
  --accent:#86A8FF; --accent-fg:#0A1020; --accent-soft:#1B2A4D;
  --warn:#FFB454; --warn-soft:#3A2A10; --crit:#FF7F8A; --crit-soft:#3D1A1F; --ok:#4FD6A0; --ok-soft:#113327;
  --road:#3B475A; --land:#151D29; --water:#14263D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6); color-scheme:dark }
:root{--side:384px;--con:0px;--top:max(12px,env(safe-area-inset-top,0px));--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
button:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
#map{position:fixed;inset:0}
.fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-weight:600}
.glass{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}

/* 검색창 · 칩 · 떠 있는 버튼 */
.search{position:fixed;z-index:4;top:var(--top);left:12px;right:12px;display:flex;gap:8px;align-items:center}
.pill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:52px;padding:0 6px 0 11px;border-radius:26px}
.pill input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;font-weight:500}
.pill input::placeholder{color:var(--faint)}
.pill input::-webkit-search-cancel-button{display:none}
.pill:focus-within{border-color:var(--accent)}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.icb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.icb:hover{background:var(--panel)}
.go{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.chips{position:fixed;z-index:4;top:calc(var(--top) + 60px);left:0;right:0;display:flex;gap:8px;padding:0 12px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 13px;border-radius:18px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chips button.unset{color:var(--faint)}
.fabs{position:fixed;z-index:4;right:calc(12px + var(--con));top:calc(var(--top) + 108px);display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.fab.on{color:var(--accent);border-color:var(--accent)}

/* 패널 · 탭 */
.panel{position:fixed;z-index:5;left:0;right:0;bottom:calc(60px + var(--bot));max-height:46dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.grab{height:22px;flex:none;display:grid;place-items:center;width:100%}
.grab::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line)}
#view{overflow:auto;padding:2px 14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.panel.collapsed #view{max-height:58px;overflow:hidden}
.tabs{position:fixed;z-index:5;left:0;right:0;bottom:0;height:calc(60px + var(--bot));padding-bottom:var(--bot);display:flex;background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--accent)}
@media (min-width:760px){
  .search,.chips{right:auto;width:var(--side);left:14px}
  .chips{padding:0 0 4px}
  .panel{left:14px;right:auto;width:var(--side);top:calc(var(--top) + 108px);bottom:auto;max-height:calc(100dvh - var(--top) - 196px);border-radius:20px}
  .grab{display:none} #view{padding-top:14px} .panel.collapsed #view{max-height:none;overflow:auto}
  .tabs{left:14px;right:auto;width:var(--side);bottom:14px;height:60px;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);padding:0}
  .fabs{top:var(--top)}
}

/* 공통 부품 */
.h{font-size:18px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.note{font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--faint)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;background:var(--card);border:1px solid var(--line);min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:12.5px;border-radius:8px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:15px;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.item .txt{min-width:0;flex:1}
.item .txt b{display:block;overflow-wrap:anywhere}
button.item:hover{border-color:var(--accent)}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.ico.school{background:var(--crit-soft);color:var(--crit)} .ico.cam,.ico.plain{background:var(--accent-soft);color:var(--accent)}
.stat{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat small{font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--muted);margin-left:3px}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.banner{border-radius:12px;padding:10px 12px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.banner.err{background:var(--crit-soft);color:var(--crit)}
.opt{flex:1 1 150px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:6px 11px;border-radius:10px;border:1px dashed var(--line);font-size:12.5px;font-weight:600;color:var(--faint)}
.badge.got{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);min-height:28px}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.switch .seg{flex:none;flex-wrap:nowrap}
.tog{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);transition:left .15s}
.tog.on{background:var(--accent)} .tog.on::after{left:21px}
details.line{background:var(--card);border:1px solid var(--line);border-radius:12px}
details.line summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:700;list-style:none}
details.line summary::-webkit-details-marker{display:none}
details.line summary .nm{flex:1;min-width:0}
details.line .cz{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
details.line .cz .nm{flex:1;min-width:0;overflow-wrap:anywhere}
details.line .cz b{font-family:var(--display);font-variant-numeric:tabular-nums}
.busy{display:flex;gap:10px;align-items:center;font-weight:600;padding:8px 0}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 지도 마커 */
.mk{display:grid;place-items:center;cursor:pointer}
.mk.hz{width:30px;height:30px;border-radius:50%;background:#D97706;color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk.hz.school{background:#D0323F} .mk.hz.cam{background:#2456D6}
.mk.pin{padding:3px 10px;border-radius:14px;font-size:12px;font-weight:700;color:#fff;background:#1B2432;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk.pin.dest{background:#D0323F}
.mk.car{width:38px;height:38px;border-radius:50%;background:#1F4FD8;color:#fff;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.mk.me{width:18px;height:18px;border-radius:50%;background:#1F7AFF;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,122,255,.25)}
.mk.sel{width:20px;height:20px;border-radius:50%;background:#1B2432;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk.pt{width:26px;height:26px;border-radius:50%;background:rgba(217,119,6,.5);border:3px solid #D97706}
.mk.pt.pend{background:rgba(255,255,255,.6);border-style:dashed;border-color:#6B7686}

/* 주행 화면 */
.hud-top{position:fixed;z-index:4;top:var(--top);left:12px;width:min(430px,calc(100vw - 24px - var(--con)));display:flex;flex-direction:column;gap:8px}
.tbt{display:flex;gap:12px;align-items:center;background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow)}
.tbt .arr{width:50px;height:50px;flex:none;display:grid;place-items:center}
.tbt .arr svg{transition:transform .25s}
.tbt-d{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tbt-t{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.dcard{border-radius:16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.dcard .big{font-size:17px;font-weight:700;line-height:1.3}
.dcard.warn{background:var(--warn-soft);border-color:var(--warn)} .dcard.warn .big{color:var(--warn)}
.dcard.ask{background:var(--accent-soft);border-color:var(--accent)} .dcard.ask .big{color:var(--accent)}
.dcard.ok{background:var(--ok-soft);border-color:var(--ok)} .dcard.ok .big{color:var(--ok)}
.hud-bot{position:fixed;z-index:4;left:0;right:var(--con);bottom:0;padding:10px 12px calc(10px + var(--bot));background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.spd{width:62px;height:62px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;text-align:center;line-height:1;flex:none}
.spd b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;display:block}.spd small{font-size:10px;color:var(--muted)}
.cam{width:50px;height:50px;border-radius:50%;border:5px solid #D0323F;background:#fff;color:#111;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;flex:none}
.eta{flex:1 1 130px;min-width:0}
.eta b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
body:not(.driving) .hud-top,body:not(.driving) .hud-bot{display:none}
body.driving .search,body.driving .chips,body.driving .panel,body.driving .tabs,body.driving .nd{display:none}
body.driving .fabs{top:auto;bottom:calc(210px + var(--bot))}
@media (min-width:760px){ body.driving .fabs{top:var(--top);bottom:auto} }

/* 음성 자막 · 토스트 · 시뮬레이션 */
.voice{background:var(--fg);color:var(--panel);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;display:flex;gap:9px;align-items:flex-start;box-shadow:var(--shadow)}
.voice.strong{background:var(--warn)}
body>.voice{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--bot));width:min(430px,calc(100vw - 24px))}
.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(var(--top) + 62px);background:var(--fg);color:var(--panel);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:min(90vw,460px);text-align:center}
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:14px;z-index:8}
.sim{background:var(--card);border-radius:16px;border:1px solid var(--line);width:min(100%,760px);max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.sim canvas{width:100%;aspect-ratio:16/9;border-radius:12px;display:block;background:#3E4B47}
.cap{font-weight:600;font-size:14.5px;min-height:44px}
.prog{height:4px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent)}

/* 가상 차량 콘솔 */
.console{position:fixed;z-index:6;top:0;right:0;bottom:0;width:min(330px,100vw);background:var(--panel);border-left:1px solid var(--line);padding:14px 14px calc(14px + var(--bot));display:flex;flex-direction:column;gap:12px;overflow:auto;transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s}
body.con-open .console{transform:none;visibility:visible}
@media (min-width:1000px){ body.con-open{--con:330px} }
.console h2{font-size:15px;font-weight:700}
.grp{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.grp label,.lab{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.grp output{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.log{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;height:200px;flex:none;overflow:auto;overflow-wrap:anywhere}
.log b{color:var(--accent);font-weight:600} .log .t{color:var(--faint)}
.maplibregl-ctrl-bottom-right{right:var(--con);bottom:calc(60px + var(--bot))}
@media (min-width:760px){ .maplibregl-ctrl-bottom-right{bottom:0} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="map" role="application" aria-label="지도"></div>

<header class="search">
  <div class="pill glass">
    <span class="logo" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c0-7 4-9 8-9s8-2 8-7"/><circle cx="12" cy="11" r="2.4" fill="currentColor"/></svg></span>
    <input id="q" type="search" placeholder="목적지 검색" autocomplete="off" enterkeyhint="search" aria-label="목적지 검색">
    <button class="icb" id="btnClear" data-act="clearQ" aria-label="검색어 지우기" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="icb" id="btnMic" data-act="mic" aria-label="음성으로 검색" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3ZM5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
  <button class="go" data-act="routeBtn" aria-label="길찾기" title="길찾기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19v-5a4 4 0 0 1 4-4h10M15 6l4 4-4 4"/></svg></button>
</header>
<div class="chips" id="chips"></div>

  clearQ() { $('#q').value = ''; $('#btnClear').hidden = true; qSeq++; A.results = null; render(); },
  mic() { try { const r = new SR(); r.lang = 'ko-KR'; r.onresult = e => { $('#q').value = e.results[0][0].transcript; doSearch(true); }; r.onerror = () => toast('음성을 인식하지 못했습니다'); r.start(); toast('목적지를 말씀해 주세요'); } catch (e) { toast('음성 검색을 쓸 수 없습니다'); } },
  routeBtn() { if (A.sel) goTo(A.sel); else if (A.results && A.results.length) goTo(A.results[0]); else if ($('#q').value.trim().length >= 2) doSearch(true); else { $('#q').focus(); toast('목적지를 입력해 주세요'); } },
  pickRes(i) { selectPlace(A.results[+i]); }, unsel() { A.sel = null; drawSel(); render(); },
  toHere() { goTo(A.sel); }, fromHere() { A.origin = Object.assign({}, A.sel); A.sel = null; drawSel(); toast(`출발지를 ${A.origin.name}(으)로 정했습니다`); if (A.dest) loadRoutes(); else render(); },
  fav(k) { DB.fav[k] = { name: A.sel.name, sub: A.sel.sub, lat: A.sel.lat, lon: A.sel.lon }; save(); toast(`${k === 'home' ? '집' : '회사'}으로 저장했습니다`); render(); },
  favGo(k) { const f = DB.fav[k]; if (f) goTo(Object.assign({}, f)); else toast(`장소를 검색하거나 지도에서 고른 뒤 ‘${k === 'home' ? '집' : '회사'}으로 저장’을 누르세요`); },
  hist(i) { const p = DB.hist[+i]; if (p) goTo({ name: p.name, sub: p.sub, lat: p.lat, lon: p.lon }); },
  pick(i) { if (A.trip || +i === A.ri || !A.routes[+i]) return; A.ri = +i; A.picked = true; A.viewed.clear(); drawRoutes(); ensureOSM(route()); render(); },
  clearDest() { closeSim(); A.dest = null; A.routes = []; A.err = null; $('#q').value = ''; $('#btnClear').hidden = true; drawRoutes(); render(); },
  simHz(id) { simHz(id); }, playAll() { const r = route(); if (!r) return; A.queue = r.hz.filter(h => !TPL[h.tpl].nosim).slice(0, 6).map(h => h.id); nextSim(); },
  simClose() { closeSim(); render(); }, simAgain: playSim, simNext: nextSim,
  replay(id) { const e = DB.events.find(x => x.id === id); if (e) { A.queue = []; openSim(e.tpl, e.place, '내 개입 순간 다시보기', { rain: e.rain, night: e.night }); } },
  simPt(id) { const p = DB.points.find(x => x.id === id); if (p) { A.queue = []; openSim(p.tpl, p.name, '개입 지점 미리보기', env()); } },
  flyPt(id) { const p = DB.points.find(x => x.id === id); if (p) { map.easeTo({ center: [p.lon, p.lat], zoom: 15.5, pitch: 0, bearing: 0 }); toast(p.name); } },
  mine(v) { A.mine = !!v; render(); },
  set(k) { S[k] = !S[k]; save(); log('App', `설정 변경: ${k} = ${S[k]}`); render(); }, cmin(n) { S.cmin = +n; save(); render(); },
  reset() { A.confirmReset = true; render(); }, resetNo() { A.confirmReset = false; render(); },
  resetYes() { store.del('nav'); DB = seedDB(); Object.assign(S, DB.settings); DB.settings = S; A.lastTrip = null; A.confirmReset = false; save(); toast('기록을 초기화했습니다'); render(); },
  demo() { if (A.demo) stopDemo('자동 시연을 중지했습니다'); else { prime(); runDemo(); } },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = ACT[b.dataset.act]; if (f) f(b.dataset.arg); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && A.sim) ACT.simClose(); });
$('#inTarget').addEventListener('input', e => { V.target = +e.target.value; $('#oTarget').textContent = V.target + ' km/h'; });
$('#inBrake').addEventListener('input', e => setBrake(e.target.value));
const steer = $('#inSteer');
steer.addEventListener('input', e => { V.steer = +e.target.value; $('#oSteer').textContent = V.steer + '°'; vehicleRules(); });
const steerBack = () => { V.steer = 0; steer.value = 0; $('#oSteer').textContent = '0°'; vehicleRules(); };
steer.addEventListener('change', steerBack); steer.addEventListener('pointerup', steerBack); steer.addEventListener('blur', steerBack);

/* ================= scripted demo ================= */
async function until(fn, max = 600000) { const me = A.demo, t0 = performance.now(); while (!fn()) { if (A.demo !== me || performance.now() - t0 > max) throw new Error('stop'); await sleep(150); } }
function stopDemo(msg) { A.demo = null; if (msg) toast(msg); render(); }
async function runDemo() {
  const me = A.demo = {}; const alive = () => { if (A.demo !== me) throw new Error('stop'); };
  try {
    if (A.trip) endTrip(); closeSim(); A.tab = 'home';
    if (!route()) { A.origin = DEF; toast(`자동 시연: ${DEF.name} → ${DEMO.name} 경로 탐색`); goTo(Object.assign({}, DEMO)); }
    render(); await until(() => route() && !A.busy, 30000); await Promise.race([route().osm, sleep(8000)]); alive();
    const first = route().hz.find(h => !TPL[h.tpl].nosim);
    if (first) { toast('출발 전: 유의지점 시뮬레이션'); await sleep(1200); alive(); simHz(first.id); await sleep(9000); alive(); }
    toast('안내를 시작하면 영상은 자동으로 닫힙니다'); await sleep(1200); alive(); startTrip(true); ACT.scale(15); await sleep(1500); alive(); cruiseOn();
    const zoneHz = () => { const T = A.trip, h = zone(); return h && h.m > 600 && h.m < route().len - 600 && T.ann[h.id] && T.ann[h.id].said ? h : null; };
    await until(() => zoneHz() || A.trip.arrived);
    if (!A.trip.arrived) {
      const h = zoneHz(); await until(() => V.m >= h.m - 120 || A.trip.arrived); alive();
      if (!A.trip.arrived) { toast('유의지점에서 운전자가 브레이크: 개입으로 기록'); setBrake(60); await sleep(1500); setBrake(0); await sleep(1500); alive(); cruiseOn(); ACT.scale(15); }
    }
    await until(() => A.trip.arrived); await sleep(3500); alive(); endTrip(); toast('주차 후 주행 리포트'); stopDemo();
  } catch (e) { if (A.demo === me) stopDemo(e.message === 'stop' ? null : '자동 시연을 진행하지 못했습니다. 인터넷 연결을 확인해 주세요.'); }
}

/* ================= boot ================= */
log('App', `AVEN 시작 · 익명 ID ${DB.id}`);
log('Vehicle', 'checkCruiseControlStateCapabilities() → 지원');
applyTheme(); render(); setInterval(tick, 100);
setInterval(() => { if (!document.hidden) loadTraffic(); }, 60000);     // 4분이 지난 정보만 다시 받는다
window.addEventListener('resize', () => map.resize());
})();
</script>
</body>
